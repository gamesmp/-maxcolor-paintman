function start(mode){lastMode=mode;document.getElementById('menu').classList.add('hide');document.getElementById('end').classList.add('hide');levelEl.textContent=mode==='easy'?'Fácil':mode==='normal'?'Normal':'Difícil';speed=mode==='easy'?.105:mode==='normal'?.118:.13;ghostSpeed=mode==='easy'?.058:mode==='normal'?.075:.092;score=0;lives=3;power=0;loadMap(maps[mode]);running=true;cancelAnimationFrame(loop);tick();}
function loadMap(lines){grid=lines.map(r=>r.split(''));dots=0;ghosts=[];for(let y=0;y<size;y++)for(let x=0;x<size;x++){if(grid[y][x]==='P'){player={x,y,px:x,py:y,progress:0};grid[y][x]=' ';}if(grid[y][x]==='.'||grid[y][x]==='o')dots++;}dir={x:0,y:0};nextDir={x:1,y:0};[[9,7],[10,7],[9,12],[10,12]].forEach((p,i)=>ghosts.push({x:p[0],y:p[1],px:p[0],py:p[1],progress:0,dir:[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}][i]}));updateHud();}
function setDir(x,y){nextDir={x,y}} window.setDir=setDir;document.querySelectorAll('.ctrl[data-d]').forEach(b=>b.onclick=()=>{let [x,y]=b.dataset.d.split(',').map(Number);setDir(x,y)});addEventListener('keydown',e=>{if(e.key==='ArrowUp')setDir(0,-1);if(e.key==='ArrowDown')setDir(0,1);if(e.key==='ArrowLeft')setDir(-1,0);if(e.key==='ArrowRight')setDir(1,0)});
let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.hypot(dx,dy)>28){Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy));sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
function wall(x,y){return x<0||y<0||x>=size||y>=size||grid[y][x]==='#'}
function moveEntity(o,spd,isGhost=false){if(o.progress<=0){if(!isGhost&&!wall(o.x+nextDir.x,o.y+nextDir.y))dir={...nextDir};if(isGhost)chooseGhost(o);let d=isGhost?o.dir:dir;if(wall(o.x+d.x,o.y+d.y)){if(!isGhost)return;chooseGhost(o);d=o.dir;}o.px=o.x;o.py=o.y;o.x+=d.x;o.y+=d.y;o.progress=1;}o.progress-=spd;if(o.progress<0)o.progress=0;}
function chooseGhost(g){let opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!wall(g.x+d.x,g.y+d.y));if(!opts.length)return;opts.sort((a,b)=>{let da=Math.abs(g.x+a.x-player.x)+Math.abs(g.y+a.y-player.y),db=Math.abs(g.x+b.x-player.x)+Math.abs(g.y+b.y-player.y);return power>0?db-da:da-db});g.dir=Math.random()<.25?opts[Math.floor(Math.random()*opts.length)]:opts[0];}
function tick(){if(!running)return;moveEntity(player,power>0?speed*1.45:speed,false);if(player.progress===0){let c=grid[player.y][player.x];if(c==='.'||c==='o'){score+=c==='o'?50:10;dots--;if(c==='o')power=520;grid[player.y][player.x]=' ';beep(c==='o'?650:360,.03);updateHud();if(dots<=0)return end(true);}}ghosts.forEach(g=>moveEntity(g,ghostSpeed,true));if(power>0)power--;checkCollisions();draw();loop=requestAnimationFrame(tick)}
function checkCollisions(){for(let g of ghosts){if(Math.abs(g.x-player.x)+Math.abs(g.y-player.y)===0&&g.progress<.5&&player.progress<.5){if(power>0){score+=200;g.x=9;g.y=7;g.px=g.x;g.py=g.y;g.progress=0;beep(120,.08);updateHud();}else{lives--;updateHud();beep(90,.15);if(lives<=0)return end(false);player.x=9;player.y=9;player.px=9;player.py=9;player.progress=0;dir={x:0,y:0};nextDir={x:1,y:0};}}}
function pos(o){return {x:(o.px*o.progress+o.x*(1-o.progress))*tile,y:(o.py*o.progress+o.y*(1-o.progress))*tile}}
function drawRound(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function drawImageOrCircle(img,x,y,w,h,fill){if(img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,w,h);else{ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x+w/2,y+h/2,w/2,0,Math.PI*2);ctx.fill();}}
function draw(){ctx.clearRect(0,0,520,520);ctx.fillStyle='#020617';ctx.fillRect(0,0,520,520);ctx.shadowColor='#3b82f6';ctx.shadowBlur=8;ctx.lineWidth=3;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(grid[y][x]==='#'){ctx.fillStyle='#071b45';ctx.strokeStyle='#2563eb';drawRound(x*tile+2,y*tile+2,tile-4,tile-4,5);ctx.fill();ctx.stroke();}ctx.shadowBlur=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++){let c=grid[y][x];if(c==='.'||c==='o'){let s=c==='o'?22:14;drawImageOrCircle(imgs.dot,x*tile+(tile-s)/2,y*tile+(tile-s)/2,s,s,c==='o'?'#f8d45b':'#60a5fa');}}ghosts.forEach(g=>{let p=pos(g);drawImageOrCircle(power>0?imgs.blue:imgs.ghost,p.x+2,p.y+2,tile-4,tile-4,power>0?'#2563eb':'#000')});let p=pos(player);drawImageOrCircle(imgs.player,p.x-2,p.y-2,tile+4,tile+4,'#1d4ed8');if(power>0){ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x+tile/2,p.y+tile/2,18+Math.sin(Date.now()/80)*3,0,Math.PI*2);ctx.stroke();}}
function updateHud(){scoreEl.textContent=score;livesEl.textContent=lives;}
function end(win){running=false;cancelAnimationFrame(loop);const endPanel=document.getElementById('end');const title=document.getElementById('endTitle');const text=document.getElementById('endText');endPanel.classList.remove('hide');title.textContent=win?'¡NIVEL COMPLETADO!':'GAME OVER';let msg='';if(win){if(lastMode==='easy'){msg=`🎉 ¡Enhorabuena!<br>Has superado el <b>Nivel Fácil</b>.<br>Ahora puedes pasar al <b>Nivel Normal</b> y podrás ganar una recompensa.<br><br><button class="btn" onclick="start('normal')">PASAR A NIVEL NORMAL</button>`;}else if(lastMode==='normal'){msg=`🎉 ¡Enhorabuena!<br>Has superado el <b>Nivel Normal</b>.<br>Ahora puedes pasar al <b>Nivel Difícil</b> y podrás ganar una recompensa.<br><br><button class="btn" onclick="start('hard')">PASAR A NIVEL DIFÍCIL</button>`;}else{title.textContent='🏆 ¡RECOMPENSA DESBLOQUEADA!';msg=`¡Increíble! Has superado <b>El Juego de Max Color</b>.<br><br>📸 Haz una captura de esta pantalla y enséñasela al equipo de Max Color para reclamar tu recompensa.`;}}else{if(lastMode==='easy'){msg=`😄 Este juego no &quot;pinta&quot; tan mal...<br><br><b>Jugar de nuevo</b>`;}else if(lastMode==='normal'){msg=`🎨 Ups, creo que necesito llenar de color de nuevo este nivel...`;}else{msg=`😅 Casi lo consigues...<br>Solo los auténticos profesionales de la pintura llegan hasta el final.`;}}text.innerHTML=msg+`<br><br><b>Puntos:</b> ${score}`;}
function openMenu(){document.getElementById('end').classList.add('hide');document.getElementById('menu').classList.remove('hide')}window.openMenu=openMenu;let audio;function beep(f,d){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
Object.values(imgs).forEach(i=>i.onload=draw);draw();
</script></body></html>
