let state='menu', current='easy', map=[], dots=0, score=0, lives=3, power=0, last=0, player, enemies=[];
function tileAt(tx,ty){ if(tx<0||ty<0||tx>=COLS||ty>=ROWS) return '#'; return map[ty][tx]; }
function walk(tx,ty){ return tileAt(tx,ty)!='#'; }
function center(v){ return Math.floor(v/TILE)*TILE+TILE/2; }
function cellOf(o){ return {x:Math.floor(o.x/TILE),y:Math.floor(o.y/TILE)}; }
function atCenter(o){ return Math.abs(o.x-center(o.x))<2 && Math.abs(o.y-center(o.y))<2; }
function resetLevel(key){
 current=key; const L=LEVELS[key]; levelEl.textContent=L.name; map=L.map.map(r=>r.split('')); dots=0; enemies=[]; score=0; lives=3; power=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let c=map[y][x]; if(c==='P'){player={x:center(x*TILE),y:center(y*TILE),dir:{x:0,y:0},next:{x:0,y:0},speed:L.speed,mouth:0}; map[y][x]=' ';} if(c==='.'||c==='*')dots++; if(c==='E'){enemies.push(makeEnemy(x,y,enemies.length)); map[y][x]=' ';}}
 const fallback=[[13,1],[1,15],[13,15],[7,7],[7,9]]; while(enemies.length<L.enemies){let p=fallback[enemies.length%fallback.length]; enemies.push(makeEnemy(p[0],p[1],enemies.length));}
 scoreEl.textContent=score; livesEl.textContent=lives; state='play'; menu.classList.add('hidden'); end.classList.add('hidden'); last=performance.now(); requestAnimationFrame(loop);
}
function makeEnemy(x,y,i){ const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]; return {x:center(x*TILE),y:center(y*TILE),dir:dirs[i%4],home:{x:center(x*TILE),y:center(y*TILE)},mode:i,speed:LEVELS[current]?.enemySpeed||70,dead:0}; }

function moveEntity(o,dt,isPlayer=false){
 if(atCenter(o)){
  o.x=center(o.x); o.y=center(o.y); const c=cellOf(o);
  if(isPlayer){
   if((o.next.x||o.next.y) && walk(c.x+o.next.x,c.y+o.next.y)) o.dir={...o.next};
   if(!walk(c.x+o.dir.x,c.y+o.dir.y)) o.dir={x:0,y:0};
  }else{
   chooseEnemyDir(o,c);
  }
 }
 const nx=o.x+o.dir.x*o.speed*dt, ny=o.y+o.dir.y*o.speed*dt;
 const aheadX=Math.floor((nx+o.dir.x*13)/TILE), aheadY=Math.floor((ny+o.dir.y*13)/TILE);
 if(o.dir.x||o.dir.y){ if(walk(aheadX,aheadY)){o.x=nx;o.y=ny;} else {o.x=center(o.x);o.y=center(o.y);o.dir={x:0,y:0};} }
}
function chooseEnemyDir(e,c){
 const opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>walk(c.x+d.x,c.y+d.y) && !(d.x===-e.dir.x&&d.y===-e.dir.y));
 if(!opts.length){ e.dir={x:-e.dir.x,y:-e.dir.y}; return; }
 const pc=cellOf(player); let target={x:pc.x,y:pc.y};
 if(power>0){ target={x:e.home.x/TILE,y:e.home.y/TILE}; }
 if(e.mode===1){ target={x:pc.x+player.dir.x*3,y:pc.y+player.dir.y*3}; }
 if(e.mode===2 && Math.random()<.38){ e.dir=opts[Math.floor(Math.random()*opts.length)]; return; }
 opts.sort((a,b)=>{let da=(c.x+a.x-target.x)**2+(c.y+a.y-target.y)**2;let db=(c.x+b.x-target.x)**2+(c.y+b.y-target.y)**2;return (power>0?db-da:da-db)});
 e.dir=opts[0];
}
function collect(){ const c=cellOf(player); let m=tileAt(c.x,c.y); if(m==='.'||m==='*'){map[c.y][c.x]=' '; dots--; score += m==='*'?50:10; if(m==='*')power=7; scoreEl.textContent=score; if(dots<=0)win();} }
function collide(){ for(const e of enemies){ const d=Math.hypot(player.x-e.x,player.y-e.y); if(d<22){ if(power>0){ score+=120; scoreEl.textContent=score; e.x=e.home.x; e.y=e.home.y; e.dir={x:1,y:0}; } else { lives--; livesEl.textContent=lives; if(lives<=0)lose(); else respawn(); } } } }
function respawn(){ const L=LEVELS[current]; for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(L.map[y][x]==='P'){player.x=center(x*TILE);player.y=center(y*TILE);player.dir={x:0,y:0};player.next={x:0,y:0};} }
function win(){ state='end'; const L=LEVELS[current]; end.classList.remove('hidden'); endTitle.textContent='¡Nivel superado!'; if(current==='easy'){endMsg.innerHTML='🎉 Enhorabuena, puedes pasar al <b>nivel normal</b> y podrás ganar una recompensa.';} else if(current==='normal'){endMsg.innerHTML='🎉 Enhorabuena, puedes pasar al <b>nivel difícil</b> y podrás ganar una recompensa.';} else {endTitle.textContent='🏆 ¡INCREÍBLE!'; endMsg.innerHTML='Has superado <b>El Juego de Max Color</b>.<br><span class="reward">Haz una captura para reclamar tu recompensa.</span>';}
 if(L.next){nextBtn.classList.remove('hidden'); nextBtn.onclick=()=>resetLevel(L.next);} else nextBtn.classList.add('hidden'); }
function lose(){ state='end'; end.classList.remove('hidden'); nextBtn.classList.add('hidden'); endTitle.textContent='GAME OVER'; if(current==='easy')endMsg.innerHTML='😄 Este juego no "pinta" tan mal...<br>Jugar de nuevo.'; else if(current==='normal')endMsg.innerHTML='🎨 Ups, creo que necesito llenar de color de nuevo este nivel...'; else endMsg.innerHTML='😅 Casi lo consigues... vuelve a intentarlo.'; }
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#06122d'; ctx.fillRect(0,0,canvas.width,canvas.height);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const c=tileAt(x,y), px=x*TILE, py=y*TILE; if(c==='#'){drawWall(px,py)} else if(c==='.' ){drawDot(px+TILE/2,py+TILE/2)} else if(c==='*'){drawStar(px+TILE/2,py+TILE/2,performance.now()/260)} }
 enemies.forEach(drawEnemy); drawPlayer(); if(power>0){ctx.fillStyle='rgba(250,204,21,.16)';ctx.fillRect(0,0,canvas.width,canvas.height);}
}
function drawWall(x,y){ctx.fillStyle='#0b2d78';ctx.fillRect(x+2,y+2,TILE-4,TILE-4);ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.strokeRect(x+4,y+4,TILE-8,TILE-8)}
function drawDot(x,y){ctx.save();ctx.globalAlpha=.95;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill();ctx.drawImage(LOGO,x-7,y-7,14,14);ctx.restore();}
function drawStar(cx,cy,t){let r1=14+Math.sin(t)*2,r2=6;ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.8);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?r2:r1;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#fde047';ctx.fill();ctx.strokeStyle='#fff7ad';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);let ang=Math.atan2(player.dir.y,player.dir.x)||0;ctx.rotate(ang);ctx.drawImage(PLAYER_IMG,-19,-19,38,38);ctx.restore();}
function drawEnemy(e,i){ctx.save();ctx.translate(e.x,e.y);let edible=power>0;ctx.fillStyle=edible?'#2563eb':'#050505';ctx.strokeStyle=edible?'#93c5fd':'#60a5fa';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-15,-15,30,30,6);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-4,4,0,Math.PI*2);ctx.arc(6,-4,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=edible?'#fef08a':'#111827';ctx.beginPath();ctx.arc(-5,-4,1.7,0,Math.PI*2);ctx.arc(7,-4,1.7,0,Math.PI*2);ctx.fill();ctx.fillStyle=edible?'#bfdbfe':'#ef4444';ctx.fillRect(-7,7,14,3);ctx.restore();}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this}}
function loop(ts){ if(state!=='play')return; let dt=Math.min((ts-last)/1000,.033); last=ts; if(power>0)power=Math.max(0,power-dt); player.speed=LEVELS[current].speed+(power>0?35:0); moveEntity(player,dt,true); collect(); enemies.forEach(e=>{e.speed=LEVELS[current].enemySpeed*(power>0?.72:1); moveEntity(e,dt,false)}); collide(); draw(); requestAnimationFrame(loop); }
draw();
</script>
</body>
</html>
