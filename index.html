let grid,rows=21,cols=21,cell=560/21,score=0,lives=3,levelKey='easy',player,ghosts=[],dir={x:0,y:0},nextDir={x:0,y:0},running=false,power=0,dots=0,last=0,moveAcc=0,ghostAcc=0;
function cloneMap(a){return a.map(r=>r.split(''))} function isWall(x,y){return x<0||y<0||x>=cols||y>=rows||grid[y][x]==='#'} function canMove(x,y,d){return !isWall(x+d.x,y+d.y)} function updateHud(){scoreEl.textContent=score;livesEl.textContent=lives}

function update(dt){if(power>0)power-=dt;moveAcc+=dt;ghostAcc+=dt;const L=levels[levelKey];if(moveAcc>=L.speed*(power>0?.72:1)){moveAcc=0;if(canMove(player.x,player.y,nextDir))dir={...nextDir};if(canMove(player.x,player.y,dir)){player.x+=dir.x;player.y+=dir.y;eatDot()}}if(ghostAcc>=L.ghostSpeed){ghostAcc=0;ghosts.forEach(moveGhost)}checkCollisions()}
function eatDot(){let c=grid[player.y][player.x];if(c==='.'||c==='o'){grid[player.y][player.x]=' ';dots--;score+=c==='o'?50:10;if(c==='o')power=7500;updateHud();beep(c==='o'?620:380,.04);if(dots<=0)win()}}
function dist(a,b,c,d){return Math.abs(a-c)+Math.abs(b-d)} function moveGhost(g){if(g.dead>0){g.dead--;return}let opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!isWall(g.x+d.x,g.y+d.y));if(!opts.length)return;opts.sort((a,b)=>dist(g.x+a.x,g.y+a.y,player.x,player.y)-dist(g.x+b.x,g.y+b.y,player.x,player.y));let chosen=power>0?opts[opts.length-1]:(Math.random()<.75?opts[0]:opts[Math.floor(Math.random()*opts.length)]);g.x+=chosen.x;g.y+=chosen.y}
function checkCollisions(){ghosts.forEach(g=>{if(g.x===player.x&&g.y===player.y){if(power>0){score+=200;updateHud();g.x=g.homeX;g.y=g.homeY;g.dead=8;beep(180,.12)}else loseLife()}})}
function loseLife(){lives--;updateHud();beep(90,.2);if(lives<=0){gameOver();return}player.x=player.homeX;player.y=player.homeY;dir={x:0,y:0};nextDir={x:0,y:0};ghosts.forEach(g=>{g.x=g.homeX;g.y=g.homeY})}
function gameOver(){running=false;let text=levelKey==='easy'?'Este juego no "pinta" tan mal...\n¡Jugar de nuevo!':levelKey==='normal'?'Ups, creo que necesito llenar de color de nuevo este nivel...':'Casi lo consigues... solo los auténticos profesionales de la pintura llegan hasta el final.';showModal('GAME OVER',text,'Jugar de nuevo',()=>startGame(levelKey))}
function win(){running=false;if(levelKey==='easy')showModal('¡Enhorabuena!','Has superado el nivel Fácil. Ahora puedes pasar al nivel Normal y podrás ganar una recompensa.','Pasar a Normal',()=>startGame('normal'));else if(levelKey==='normal')showModal('¡Enhorabuena!','Has superado el nivel Normal. Ahora puedes pasar al nivel Difícil y podrás ganar una recompensa.','Pasar a Difícil',()=>startGame('hard'));else showModal('¡Recompensa desbloqueada!','Has superado El Juego de Max Color. Haz una captura de esta pantalla para reclamar tu recompensa.','Jugar otra vez',()=>startGame('easy'))}
function showModal(t,txt,btn,fn){modalTitle.textContent=t;modalText.innerText=txt;nextBtn.textContent=btn;nextBtn.onclick=fn;menuBtn.onclick=()=>{modal.classList.add('hidden');menu.classList.remove('hidden')};modal.classList.remove('hidden')}
function draw(){ctx.clearRect(0,0,560,560);ctx.fillStyle='#010616';ctx.fillRect(0,0,560,560);if(!grid)return;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let px=x*cell,py=y*cell,c=grid[y][x];if(c==='#')drawWall(px,py);else if(c==='.'||c==='o')drawDot(px,py,c==='o')}ghosts.forEach(drawGhost);drawPlayer();if(power>0){ctx.fillStyle='rgba(49,124,255,.18)';ctx.fillRect(0,0,560,560)}}
function drawWall(px,py){ctx.fillStyle='#09235d';ctx.fillRect(px+3,py+3,cell-6,cell-6);ctx.strokeStyle='#2f7cff';ctx.lineWidth=3;ctx.shadowColor='#2f7cff';ctx.shadowBlur=8;ctx.strokeRect(px+4,py+4,cell-8,cell-8);ctx.shadowBlur=0} function drawDot(px,py,big){let s=big?cell*.78:cell*.48;ctx.save();ctx.shadowColor=big?'#ffe36b':'#66a3ff';ctx.shadowBlur=big?15:8;ctx.drawImage(imgs.logo,px+(cell-s)/2,py+(cell-s)/2,s,s);ctx.restore()} function drawPlayer(){let s=cell*1.25;ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=10;ctx.drawImage(imgs.player,player.x*cell+(cell-s)/2,player.y*cell+(cell-s)/2,s,s);ctx.restore()} function drawGhost(g){let s=cell*1.18;ctx.save();ctx.shadowColor=power>0?'#42a5ff':'#111';ctx.shadowBlur=12;if(power>0){ctx.globalAlpha=.88;ctx.filter='brightness(1.6) saturate(2) hue-rotate(170deg)'}ctx.drawImage(imgs.ghost,g.x*cell+(cell-s)/2,g.y*cell+(cell-s)/2,s,s);ctx.restore()}
let audioCtx;function beep(freq,dur){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}} 
</script></body></html>
