const W=19,H=17,TILE=40,CW=W*TILE,CH=H*TILE;canvas.width=CW;canvas.height=CH;

function resetMap(){grid=RAW.map(r=>r.split(''));dots=new Set();stars=new Set();for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(grid[y][x]==='.')dots.add(x+','+y);if(grid[y][x]==='*')stars.add(x+','+y)}}
function tileAt(x,y){return{x:Math.floor(x/TILE),y:Math.floor(y/TILE)}}function centerOf(tx,ty){return{x:tx*TILE+TILE/2,y:ty*TILE+TILE/2}}function isWall(tx,ty){return tx<0||ty<0||tx>=W||ty>=H||grid[ty][tx]==='#'}
function atCenter(o){let t=tileAt(o.x,o.y),c=centerOf(t.x,t.y);return Math.abs(o.x-c.x)<3&&Math.abs(o.y-c.y)<3}function snap(o){let t=tileAt(o.x,o.y),c=centerOf(t.x,t.y);o.x=c.x;o.y=c.y}function canDir(o,d){let t=tileAt(o.x,o.y);return !isWall(t.x+d.x,t.y+d.y)}
function showMenu(){running=false;menu.classList.remove('hidden');end.classList.add('hidden')}
function startGame(k){levelKey=k;resetMap();score=0;lives=3;power=0;queued={x:1,y:0};let c=centerOf(1,1);player={x:c.x,y:c.y,dir:{x:1,y:0},speed:cfg[k].player};const starts=[[17,15], [17,1], [1,15], [9,8]];const dirs=[{x:-1,y:0},{x:0,y:1},{x:1,y:0},{x:0,y:-1}];enemies=starts.slice(0,cfg[k].n).map((p,i)=>{let cc=centerOf(p[0],p[1]);return{x:cc.x,y:cc.y,dir:dirs[i],speed:cfg[k].enemy+i*4,active:true}});levelEl.textContent=cfg[k].name;scoreEl.textContent=score;livesEl.textContent=lives;menu.classList.add('hidden');end.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}
function setDirName(n){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};queued=dirs[n]||queued}
document.querySelectorAll('.ctrl').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDirName(b.dataset.d)}));window.addEventListener('keydown',e=>{if(e.key==='ArrowUp')setDirName('up');if(e.key==='ArrowDown')setDirName('down');if(e.key==='ArrowLeft')setDirName('left');if(e.key==='ArrowRight')setDirName('right')});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:false});canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});canvas.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy))setDirName(dx>0?'right':'left');else setDirName(dy>0?'down':'up')},{passive:false});
function moveObj(o,dt,isPlayer=false){if(atCenter(o)){snap(o);if(isPlayer){if(canDir(o,queued))o.dir={...queued};else if(!canDir(o,o.dir))o.dir={x:0,y:0}}else chooseEnemyDir(o)}let dist=o.speed*dt;while(dist>0){if(o.dir.x===0&&o.dir.y===0)break;let step=Math.min(dist,6);dist-=step;let nx=o.x+o.dir.x*step,ny=o.y+o.dir.y*step,t=tileAt(nx,ny);if(isWall(t.x,t.y)){snap(o);if(isPlayer)o.dir={x:0,y:0};else chooseEnemyDir(o);break}else{o.x=nx;o.y=ny}}}
function chooseEnemyDir(e){if(!e.active)return;let t=tileAt(e.x,e.y);let options=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!isWall(t.x+d.x,t.y+d.y));if(!options.length){e.dir={x:0,y:0};return}let rev={x:-e.dir.x,y:-e.dir.y};let nonRev=options.filter(d=>!(d.x===rev.x&&d.y===rev.y));if(nonRev.length)options=nonRev;let pt=tileAt(player.x,player.y);options.sort((a,b)=>dist2(t.x+a.x,t.y+a.y,pt.x,pt.y)-dist2(t.x+b.x,t.y+b.y,pt.x,pt.y));e.dir=power>0?options[options.length-1]:options[0]}
function dist2(ax,ay,bx,by){return(ax-bx)*(ax-bx)+(ay-by)*(ay-by)}
function collect(){let t=tileAt(player.x,player.y),key=t.x+','+t.y;if(dots.has(key)){dots.delete(key);score+=10;scoreEl.textContent=score}if(stars.has(key)){stars.delete(key);score+=50;power=8;scoreEl.textContent=score}if(dots.size+stars.size===0)win()}
function collisions(){for(const e of enemies){if(!e.active)continue;let d=Math.hypot(player.x-e.x,player.y-e.y);if(d<24){if(power>0){e.active=false;score+=200;scoreEl.textContent=score}else loseLife()}}}
function loseLife(){lives--;livesEl.textContent=lives;if(lives<=0)gameOver();else{let c=centerOf(1,1);player.x=c.x;player.y=c.y;player.dir={x:1,y:0};queued={x:1,y:0}}}
function gameOver(){running=false;end.classList.remove('hidden');let msg=levelKey==='easy'?'Este juego no “pinta” tan mal...\n¡Jugar de nuevo!':levelKey==='normal'?'Ups, creo que necesito llenar de color de nuevo este nivel...':'Casi lo consigues... solo los auténticos profesionales llegan hasta el final.';endTitle.textContent='GAME OVER';endText.innerText=msg;nextBtn.textContent='REINTENTAR';nextBtn.onclick=()=>startGame(levelKey)}
function win(){running=false;end.classList.remove('hidden');if(levelKey==='easy'){endTitle.textContent='¡ENHORABUENA!';endText.innerText='Has superado el nivel fácil. Puedes pasar al nivel normal y podrás ganar una recompensa.';nextBtn.textContent='PASAR A NORMAL';nextBtn.onclick=()=>startGame('normal')}else if(levelKey==='normal'){endTitle.textContent='¡ENHORABUENA!';endText.innerText='Has superado el nivel normal. Puedes pasar al nivel difícil y podrás ganar una recompensa.';nextBtn.textContent='PASAR A DIFÍCIL';nextBtn.onclick=()=>startGame('hard')}else{endTitle.textContent='¡INCREÍBLE!';endText.innerText='Has superado El Juego de Max Color. Haz captura de esta pantalla para reclamar tu recompensa.';nextBtn.textContent='JUGAR DE NUEVO';nextBtn.onclick=()=>startGame('hard')}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawBucket(x,y,size,black=false){ctx.save();ctx.translate(x,y);if(black){ctx.fillStyle=power>0?'#2563eb':'#050505';ctx.strokeStyle=power>0?'#bfdbfe':'#ffffff';ctx.lineWidth=3;roundRect(-size*.42,-size*.36,size*.84,size*.78,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-size*.16,-size*.07,size*.08,0,Math.PI*2);ctx.arc(size*.16,-size*.07,size*.08,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.fillRect(-size*.24,size*.15,size*.48,3)}else{ctx.drawImage(playerImg,x-size*.52,y-size*.42,size*1.04,size*.84)}ctx.restore()}
function drawStar(cx,cy,r){ctx.save();ctx.translate(cx,cy);ctx.rotate(performance.now()/450);ctx.fillStyle='#facc15';ctx.strokeStyle='#fff7ad';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){let rr=i%2===0?r:r*.45,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#020617';ctx.fillRect(0,0,CW,CH);for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==='#'){let px=x*TILE,py=y*TILE;ctx.fillStyle='#081a44';ctx.fillRect(px+2,py+2,TILE-4,TILE-4);ctx.strokeStyle='#2f7cff';ctx.lineWidth=3;ctx.strokeRect(px+4,py+4,TILE-8,TILE-8)}dots.forEach(k=>{let a=k.split(',').map(Number),c=centerOf(a[0],a[1]);ctx.drawImage(logoImg,c.x-7,c.y-7,14,14)});stars.forEach(k=>{let a=k.split(',').map(Number),c=centerOf(a[0],a[1]);drawStar(c.x,c.y,15)});enemies.forEach(e=>{if(e.active)drawBucket(e.x,e.y,34,true)});drawBucket(player.x,player.y,37,false);if(power>0){ctx.fillStyle='#60a5fa';ctx.font='bold 16px Arial';ctx.fillText('PODER AZUL: '+Math.ceil(power),12,CH-12)}}
function loop(ts){if(!running)return;let dt=Math.min((ts-last)/1000,0.033);last=ts;if(power>0)power-=dt;moveObj(player,dt,true);enemies.forEach(e=>moveObj(e,dt,false));collect();collisions();draw();requestAnimationFrame(loop)}
draw();
</script></body></html>
