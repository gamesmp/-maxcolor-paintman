<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Max Color Paint-Man</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#030713;color:white;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.wrap{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 6px 96px}.title{font-weight:900;letter-spacing:2px;font-size:clamp(20px,6vw,34px);color:#f8d45b;text-shadow:0 0 10px #3b82f6,3px 3px #00144d;margin:5px 0 2px}.hud{width:min(96vw,520px);display:flex;justify-content:space-between;gap:6px;font-size:13px;text-transform:uppercase;color:#dbeafe;margin-bottom:5px}.pill{border:2px solid #2563eb;background:#071b45;border-radius:8px;padding:5px 7px;box-shadow:0 0 12px #1d4ed8 inset}canvas{width:min(96vw,520px);height:min(96vw,520px);max-height:calc(100vh - 170px);image-rendering:auto;background:#020617;border:4px solid #2563eb;border-radius:14px;box-shadow:0 0 22px #1d4ed8}.panel{position:fixed;inset:0;background:radial-gradient(circle at top,#0f2a64 0,#030713 58%,#000 100%);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.card{width:min(92vw,430px);border:3px solid #3b82f6;border-radius:18px;padding:20px;background:rgba(2,6,23,.9);box-shadow:0 0 25px #2563eb, inset 0 0 22px #0b2c66}.logo{width:118px;height:118px;object-fit:contain;margin:0 auto 8px;filter:drop-shadow(0 0 13px #60a5fa)}h2{margin:7px 0;color:#f8d45b;text-shadow:2px 2px #000;font-size:30px}.sub{color:#dbeafe;line-height:1.35}.btn{width:85%;max-width:300px;margin:7px auto;padding:14px 16px;border:3px solid #bfdbfe;border-radius:12px;color:white;background:linear-gradient(180deg,#2563eb,#1e3a8a);font-size:18px;font-weight:900;display:block;box-shadow:0 0 14px #1d4ed8;cursor:pointer}.btn:active{transform:scale(.97)}.controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:64px 64px 64px;gap:7px;z-index:12}.ctrl{width:64px;height:54px;border-radius:13px;border:2px solid #dbeafe;background:#0b2c66;color:white;font-size:26px;font-weight:900;box-shadow:0 0 9px #2563eb}.empty{visibility:hidden}.hint{font-size:12px;color:#93c5fd;margin-top:10px}.hide{display:none!important}@media(min-width:700px){.controls{display:none}.wrap{padding-bottom:12px}.hud{font-size:15px}}
</style></head><body>
<div class="wrap"><div class="title">PAINT-MAN MAX COLOR</div><div class="hud"><span class="pill">Puntos: <b id="score">0</b></span><span class="pill">Vidas: <b id="lives">3</b></span><span class="pill">Nivel: <b id="level">Fácil</b></span></div><canvas id="game" width="520" height="520"></canvas></div>
<div class="controls"><button class="ctrl empty"></button><button class="ctrl" data-d="0,-1">▲</button><button class="ctrl empty"></button><button class="ctrl" data-d="-1,0">◀</button><button class="ctrl" data-d="0,1">▼</button><button class="ctrl" data-d="1,0">▶</button></div>
<div id="menu" class="panel"><div class="card"><img class="logo" src="assets/player-bucket.png"><h2>MAX COLOR</h2><p class="sub">Recoge los logos, activa el poder azul y cómete los cubos negros.</p><button class="btn" onclick="start('easy')">FÁCIL</button><button class="btn" onclick="start('normal')">NORMAL</button><button class="btn" onclick="start('hard')">DIFÍCIL</button><p class="hint">Móvil: botones o desliza el dedo. PC: flechas.</p></div></div>
<div id="end" class="panel hide"><div class="card"><img id="endImg" class="logo" src="assets/player-bucket.png"><h2 id="endTitle">GAME OVER</h2><p id="endText" class="sub"></p><button class="btn" onclick="openMenu()">VOLVER AL MENÚ</button><button class="btn" onclick="start(lastMode)">REINTENTAR</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level');
const imgPlayer=new Image(),imgDot=new Image(),imgGhost=new Image(),imgBlue=new Image();imgPlayer.src='assets/player-bucket.png';imgDot.src='assets/paint-dot.png';imgGhost.src='assets/black-bucket.png';imgBlue.src='assets/blue-bucket.png';
const size=20, tile=26; canvas.width=canvas.height=size*tile;
const maps={easy:[
'####################','#o.......#........o#','#.####.#.#.#.####..#','#......#...#.......#','#.##.###.#.###.##..#','#....#...#...#.....#','####.#.#####.#.#####','#......#...#.......#','#.####.#.#.#.####..#','#......#P#.........#','#.####.#.#.#.####..#','#......#...#.......#','####.#.#####.#.#####','#....#...#...#.....#','#.##.###.#.###.##..#','#......#...#.......#','#.####.#.#.#.####..#','#o.......#........o#','####################','####################'],
normal:['####################','#o....#.....#.....o#','#.##.#.###.#.###.#.#','#....#...#.#...#...#','####.###.#.#.###.###','#......#...#.......#','#.####.#####.####..#','#.#.............#..#','#.#.###.###.###.#..#','#...#...P...#......#','#.#.###.###.###.#..#','#.#.............#..#','#.####.#####.####..#','#......#...#.......#','###.###.#.#.###.####','#...#...#.#...#....#','#.#.###.#.###.#.##.#','#o.....#.....#....o#','####################','####################'],
hard:['####################','#o..#.....#.....#..o','#.#.#.###.#.###.#.##','#.#...#...#...#....#','#.#####.#####.####.#','#.....#.......#....#','#####.#.#####.#.####','#.....#...#...#....#','#.###.###.#.###.##.#','#...#....P....#....#','#.#.###.#.###.###..#','#....#...#...#.....#','####.#.#####.#.#####','#....#.......#.....#','#.####.#####.#####.#','#....#...#...#...#.#','##.#.###.#.###.#.#.#','#o..#.....#.....#..o','####################','####################']};
let grid=[],player,dir,nextDir,ghosts=[],score=0,lives=3,dots=0,power=0,loop,lastMode='easy',running=false,levelName='Fácil',speed=0.105,ghostSpeed=0.075;
function start(mode){lastMode=mode;document.getElementById('menu').classList.add('hide');document.getElementById('end').classList.add('hide');levelName=mode==='easy'?'Fácil':mode==='normal'?'Normal':'Difícil';levelEl.textContent=levelName;speed=mode==='easy'?0.105:mode==='normal'?0.115:0.13;ghostSpeed=mode==='easy'?0.058:mode==='normal'?0.073:0.091;score=0;lives=3;power=0;loadMap(maps[mode]);running=true;cancelAnimationFrame(loop);tick();}
function loadMap(lines){grid=lines.map(r=>r.split(''));dots=0;ghosts=[];for(let y=0;y<size;y++)for(let x=0;x<size;x++){if(grid[y][x]==='P'){player={x,y,px:x,py:y,progress:0};grid[y][x]=' ';} if(grid[y][x]==='.'||grid[y][x]==='o')dots++;}dir={x:0,y:0};nextDir={x:1,y:0};const starts=[[9,7],[10,7],[9,12],[10,12]];ghosts=starts.map((p,i)=>({x:p[0],y:p[1],px:p[0],py:p[1],progress:0,dir:[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}][i]}));updateHud();}
function setDir(x,y){nextDir={x,y}} window.setDir=setDir;
document.querySelectorAll('.ctrl[data-d]').forEach(b=>b.onclick=()=>{let [x,y]=b.dataset.d.split(',').map(Number);setDir(x,y)});addEventListener('keydown',e=>{if(e.key==='ArrowUp')setDir(0,-1);if(e.key==='ArrowDown')setDir(0,1);if(e.key==='ArrowLeft')setDir(-1,0);if(e.key==='ArrowRight')setDir(1,0)});
let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.hypot(dx,dy)>28){Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy));sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
function wall(x,y){return x<0||y<0||x>=size||y>=size||grid[y][x]==='#'}
function moveEntity(o,spd,isGhost=false){if(o.progress<=0){if(!isGhost&&!wall(o.x+nextDir.x,o.y+nextDir.y))dir={...nextDir}; if(isGhost){chooseGhost(o)} let d=isGhost?o.dir:dir;if(wall(o.x+d.x,o.y+d.y)){if(!isGhost) return; chooseGhost(o);} o.px=o.x;o.py=o.y;o.x+= (isGhost?o.dir.x:dir.x);o.y+=(isGhost?o.dir.y:dir.y);o.progress=1;}o.progress-=spd;if(o.progress<0)o.progress=0;}
function chooseGhost(g){let opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!wall(g.x+d.x,g.y+d.y)); if(!opts.length)return; let frightened=power>0; opts.sort((a,b)=>{let da=Math.abs(g.x+a.x-player.x)+Math.abs(g.y+a.y-player.y);let db=Math.abs(g.x+b.x-player.x)+Math.abs(g.y+b.y-player.y);return frightened?db-da:da-db}); g.dir=Math.random()<0.25?opts[Math.floor(Math.random()*opts.length)]:opts[0];}
function tick(){if(!running)return;moveEntity(player,power>0?speed*1.45:speed,false);if(player.progress===0){let c=grid[player.y][player.x];if(c==='.'||c==='o'){score+=c==='o'?50:10;dots--;if(c==='o')power=520;grid[player.y][player.x]=' ';beep(c==='o'?650:360,0.03);updateHud();if(dots<=0)return end(true);}}ghosts.forEach(g=>moveEntity(g,ghostSpeed,true));if(power>0)power--;checkCollisions();draw();loop=requestAnimationFrame(tick)}
function checkCollisions(){for(let g of ghosts){if(Math.abs(g.x-player.x)+Math.abs(g.y-player.y)===0&&g.progress<.45&&player.progress<.45){if(power>0){score+=200;g.x=9;g.y=7;g.px=g.x;g.py=g.y;g.progress=0;beep(120,0.08);updateHud();}else{lives--;updateHud();beep(90,0.15); if(lives<=0)return end(false); player.x=9;player.y=9;player.px=9;player.py=9;player.progress=0;dir={x:0,y:0};nextDir={x:1,y:0};}}}}
function pos(o){return {x:(o.px*o.progress+o.x*(1-o.progress))*tile,y:(o.py*o.progress+o.y*(1-o.progress))*tile}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#020617';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.shadowColor='#3b82f6';ctx.shadowBlur=9;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(grid[y][x]==='#'){ctx.fillStyle='#071b45';roundRect(x*tile+2,y*tile+2,tile-4,tile-4,5,true);ctx.strokeRect(x*tile+3,y*tile+3,tile-6,tile-6)}ctx.shadowBlur=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++){if(grid[y][x]==='.'||grid[y][x]==='o'){let s=grid[y][x]==='o'?22:14;ctx.drawImage(imgDot,x*tile+(tile-s)/2,y*tile+(tile-s)/2,s,s)}}ghosts.forEach(g=>{let p=pos(g),im=power>0?imgBlue:imgGhost;ctx.drawImage(im,p.x+2,p.y+2,tile-4,tile-4)});let p=pos(player);ctx.drawImage(imgPlayer,p.x-2,p.y-2,tile+4,tile+4); if(power>0){ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x+tile/2,p.y+tile/2,18+Math.sin(Date.now()/80)*3,0,Math.PI*2);ctx.stroke();}}
function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r); if(fill)ctx.fill();}
function updateHud(){scoreEl.textContent=score;livesEl.textContent=lives;}
function end(win){running=false;cancelAnimationFrame(loop);document.getElementById('end').classList.remove('hide');document.getElementById('endTitle').textContent=win?'¡NIVEL COMPLETADO!':'GAME OVER';document.getElementById('endText').innerHTML=win?`Has dejado el laberinto impecable.<br><b>${score} puntos</b> para el equipo MAX COLOR.`:`Te han atrapado los cubos negros.<br><b>${score} puntos</b>. Vuelve a pintar el laberinto.`;}
function openMenu(){document.getElementById('end').classList.add('hide');document.getElementById('menu').classList.remove('hide')} window.openMenu=openMenu;
let audio;function beep(f,d){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
[imgPlayer,imgDot,imgGhost,imgBlue].forEach(i=>i.onload=draw);
draw();
</script></body></html>
